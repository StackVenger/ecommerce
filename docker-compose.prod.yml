version: '3.8'

# Production stack: Postgres + Redis + NestJS API + Next.js web + nginx.
# Public ingress: nginx on :80 (HTTP only — no domain / no SSL today).
# All inter-service traffic stays on the ecommerce-network bridge.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: ecommerce-api
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - CORS_ORIGIN=http://${DOMAIN}
      - FRONTEND_URL=http://${DOMAIN}
      - WEB_URL=http://${DOMAIN}
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:4000/api/v1/healthz',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - api-uploads:/app/uploads
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: http://${DOMAIN}/api/v1
        NEXT_PUBLIC_APP_URL: http://${DOMAIN}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    container_name: ecommerce-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    expose:
      - '3000'
    depends_on:
      - api
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    expose:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: always
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '3'

  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - api
      - web
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network

volumes:
  postgres-data:
    name: ecommerce-postgres-data
  redis-data:
    name: ecommerce-redis-data
  api-uploads:
    name: ecommerce-api-uploads
  nginx-cache:
    name: ecommerce-nginx-cache
