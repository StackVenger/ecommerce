# ═══════════════════════════════════════════════════════════
# Deploy to VPS — runs on every push to main
# ═══════════════════════════════════════════════════════════
# Required GitHub secrets (set via `gh secret set <NAME>`):
#   VPS_HOST     — e.g. 103.187.23.21 or yourdomain.com
#   VPS_USER     — usually "root"
#   VPS_SSH_KEY  — private key (PEM) matching a pubkey in the VPS authorized_keys
#
# What it does:
#   1. Checkout the repo
#   2. rsync the codebase to /opt/ecommerce on the VPS
#   3. docker compose up -d --build (rebuilds only what changed)
#   4. wait for api + web healthchecks to flip to healthy
#   5. smoke-test the public endpoints
# ═══════════════════════════════════════════════════════════

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow manual triggers from the Actions tab

concurrency:
  group: deploy-vps
  cancel-in-progress: false # don't kill an in-flight deploy

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.next' \
            --exclude='.turbo' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.production' \
            --exclude='*.log' \
            --exclude='uploads/' \
            --exclude='secrets.md' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/ecommerce/"

      - name: Build + restart Docker stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'REMOTE'
            set -e
            cd /opt/ecommerce
            echo "--- pulling third-party images if newer ---"
            docker compose -f docker-compose.prod.yml --env-file .env pull postgres redis nginx 2>&1 | tail -5 || true
            echo "--- building app images ---"
            docker compose -f docker-compose.prod.yml --env-file .env build api web
            echo "--- bringing stack up ---"
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            echo "--- pruning dangling images to reclaim disk ---"
            docker image prune -f 2>&1 | tail -3
          REMOTE

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'docker inspect ecommerce-api ecommerce-web --format "{{.Name}}={{.State.Health.Status}}" 2>/dev/null | paste -sd "," -')
            echo "[$i/30] $STATUS"
            case "$STATUS" in
              *unhealthy*)
                echo "::error::A container went unhealthy"
                ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                  "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                  'docker logs --tail=80 ecommerce-api; echo "---web---"; docker logs --tail=40 ecommerce-web'
                exit 1
                ;;
              *starting*)
                sleep 5
                continue
                ;;
              *=healthy*=healthy*)
                echo "✓ both api + web healthy"
                exit 0
                ;;
            esac
            sleep 5
          done
          echo "::error::Timed out waiting for healthy"
          exit 1

      - name: Smoke-test public endpoints
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          SCHEME_OK=""
          for SCHEME in https http; do
            CODE=$(curl -sk -o /dev/null -w "%{http_code}" -m 10 "$SCHEME://$HOST/api/v1/healthz" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✓ $SCHEME://$HOST is up"
              SCHEME_OK=$SCHEME
              break
            fi
          done
          if [ -z "$SCHEME_OK" ]; then
            echo "::error::Neither http nor https responded with 200 on /api/v1/healthz"
            exit 1
          fi
          for PATH_ in / /shop /login /admin /api/v1/health; do
            CODE=$(curl -sk -o /dev/null -w "%{http_code}" -m 10 "$SCHEME_OK://$HOST$PATH_" || echo "000")
            printf "  %-20s -> %s\n" "$PATH_" "$CODE"
            if [ "$CODE" != "200" ]; then
              echo "::warning::$PATH_ returned $CODE"
            fi
          done
